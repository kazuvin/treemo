[package]
name = "treemo"
version = "0.1.0"
description = "Keyboard-first Markdown notes with logic trees"
authors = ["kazuvin"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "treemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
thiserror = "2.0.20"
blake3 = "1.8.7"
trash = "5.2.9"
notify = "8.2.0"
tauri-plugin-dialog = "2.7.3"

[dev-dependencies]
tempfile = "3.27.0"
