pre-commit:
  parallel: true
  jobs:
    # oxlint --fix と oxfmt は同じファイルを書き換えるので、並列にせず順に流す
    - group:
        parallel: false
        jobs:
          - name: oxlint
            glob: '*.{js,jsx,ts,tsx,mts,mjs}'
            run: pnpm exec oxlint --fix {staged_files}
            stage_fixed: true
          - name: oxfmt
            glob: '*.{js,jsx,ts,tsx,mts,mjs,json,jsonc,css}'
            run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
    # tsc はプロジェクト全体を見るのでファイル単位に絞れない
    - name: typecheck
      run: pnpm run typecheck
    - name: rustfmt
      glob: 'src-tauri/**/*.rs'
      run: cargo fmt --manifest-path src-tauri/Cargo.toml
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
