name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Lint / Type Check / Test / Build (web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から読む
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build web assets
        run: pnpm run build:web

  rust:
    name: Rust (fmt / clippy / test)
    # macOS 専用アプリで、iCloud まわりは macOS の API を cfg(target_os) で呼ぶ。
    # Linux ではそのコードが検査されないので、分数の倍率がかかっても macOS で回す。
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! が frontendDist の存在を確かめるので、中身は空でよい
      - name: Prepare frontendDist
        run: mkdir -p dist

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml
